
spring:
  application:
    name: spring-otel-starter-backend

management:
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  tracing:
    enabled: true
    propagation:
      consume: [w3c,b3,b3_multi]
      produce: [w3c,b3]
    sampling:
      probability: 1
#  metrics:
#    kafka:
#      consumer:
#        enabled: false
#      producer:
#        enabled: false

otel:
  propagators:
    - tracecontext
    - b3
    - b3multi
  resource:
    attributes:
      deployment.environment: dev
      service:
        name: spring-otel-starter-backend
        namespace: internal
