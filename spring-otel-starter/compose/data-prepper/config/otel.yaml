log-pipeline:
  source:
    otel_logs_source:
      ssl: false
  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        index: logs

metrics-pipeline:
  source:
    otel_metrics_source:
      ssl: false
  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        index: metrics

traces-pipeline:
  source:
    otel_trace_source:
      ssl: false
  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        index: traces