receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
#  elasticsearch:
#    endpoints: [http://elasticsearch:9200]
#    logs_index: my_log_index
#    sending_queue:
#      enabled: true
#      num_consumers: 20
#      queue_size: 1000
  otlp/trace:
    endpoint: data-prepper:21890
    tls:
      insecure: true
  otlp/metrics:
    endpoint: data-prepper:21891
    tls:
      insecure: true
  otlp/logs:
    endpoint: data-prepper:21892
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/trace ]
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/metrics ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/logs ]