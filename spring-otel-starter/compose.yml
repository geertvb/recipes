services:

  kafka:
    image: apache/kafka
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'ZVdxSsRfdkS7IcLbYbGi5g'
      KAFKA_NUM_PARTITIONS: 10

  collector:
    image: otel/opentelemetry-collector-contrib
    hostname: collector
    container_name: collector
    ports:
      - "5000:5000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./compose/otel/config/config.yaml:/etc/otelcol-contrib/config.yaml
      - ./compose/otel/data/:/var/otel/data/

  data-prepper:
    image: opensearchproject/data-prepper
    hostname: data-prepper
    container_name: data-prepper
    ports:
      - "4900:4900"
    volumes:
      - ./compose/data-prepper/config/pipelines/:/usr/share/data-prepper/pipelines/
    depends_on:
      - opensearch

  opensearch:
    image: opensearchproject/opensearch
    hostname: opensearch
    container_name: opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards
    hostname: opensearch-dashboards
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
